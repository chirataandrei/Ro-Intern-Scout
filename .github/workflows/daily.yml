name: Daily internship digest

on:
  schedule:
    # 08:00 Europe/Bucharest in summer (EEST, UTC+3)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m internscout scan --email

      - name: Persist seen jobs
        run: |
          git config user.name "internscout-bot"
          git config user.email "internscout-bot@users.noreply.github.com"
          git add data/seen.json
          if git diff --staged --quiet; then
            echo "No seen.json changes"
          else
            git commit -m "chore: update seen internship ids"
            git pull --rebase origin main
            git push
          fi
